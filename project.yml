name: AuraLinkNative
options:
  bundleIdPrefix: com.auralink
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ML5W9R5552
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  AuraLinkNative:
    type: application
    platform: iOS
    sources:
      - path: AuraLinkNative/AuraLinkNativeApp.swift
      - path: AuraLinkNative/Core
      - path: AuraLinkNative/Design
      - path: AuraLinkNative/Views
    resources:
      - path: AuraLinkNative/Resources
    info:
      path: AuraLinkNative/Info.plist
      properties:
        CFBundleDisplayName: Aura Link
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: Selecione imagens para conversar e criar com a Aura.
        NSCameraUsageDescription: Use a câmera para anexar referências aos chats.
        NSMicrophoneUsageDescription: Converse com a Aura usando sua voz.
        NSSpeechRecognitionUsageDescription: Transforme sua voz em texto nas conversas com a Aura.
        NSPhotoLibraryAddUsageDescription: Salve imagens e arquivos criados pela Aura no seu iPhone.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.auralink.app
            CFBundleURLSchemes:
              - auralink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralink.app
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: AuraLink_AppStoreProfile
        INFOPLIST_FILE: AuraLinkNative/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - AuraLinkNativeTests
  AuraLinkNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AuraLinkNativeTests
    dependencies:
      - target: AuraLinkNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralink.app.tests
