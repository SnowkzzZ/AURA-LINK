name: AuraLinkNative
options:
  bundleIdPrefix: com.auralink
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ML5W9R5552
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.48.0
targets:
  AuraLinkNative:
    type: application
    platform: iOS
    sources:
      - path: AuraLinkNative/AuraLinkNativeApp.swift
      - path: AuraLinkNative/Core
      - path: AuraLinkNative/Design
      - path: AuraLinkNative/Models
      - path: AuraLinkNative/Views
    resources:
      - path: AuraLinkNative/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: AuraLinkNative/Info.plist
      properties:
        CFBundleDisplayName: Aura Link
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: Selecione imagens para conversar e criar com a Aura.
        NSCameraUsageDescription: Use a câmera para anexar referências aos chats.
        NSMicrophoneUsageDescription: Converse com a Aura usando sua voz.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.auralink.app
            CFBundleURLSchemes:
              - auralink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralink.app
        INFOPLIST_FILE: AuraLinkNative/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - AuraLinkNativeTests
  AuraLinkNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AuraLinkNativeTests
    dependencies:
      - target: AuraLinkNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralink.app.tests
