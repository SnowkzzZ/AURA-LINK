name: Aura Link iOS · TestFlight

on:
  push:
    tags: ["ios-testflight-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Enviar o build aprovado ao TestFlight
        required: true
        type: boolean
        default: false
      build_number:
        description: Número incremental do build
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Selecionar Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto
        run: xcodegen generate
      - name: Configurar ambiente público
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_URL string ${SUPABASE_URL:-https://example.supabase.co}" AuraLinkNative/Info.plist
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_PUBLISHABLE_KEY string ${SUPABASE_PUBLISHABLE_KEY:-build-validation-key}" AuraLinkNative/Info.plist
      - name: Compilar e testar no simulador
        run: |
          xcodebuild test \
            -project AuraLinkNative.xcodeproj \
            -scheme AuraLinkNative \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    if: ${{ startsWith(github.ref, 'refs/tags/ios-testflight-') || (github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight) }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Preparar chaves e perfil
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          printf '%s' "$PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          security create-keychain -p actions $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p actions $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k actions $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Configurar aplicação
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_URL string ${SUPABASE_URL:-https://zccnvksigtixbzdilxvy.supabase.co}" AuraLinkNative/Info.plist
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_PUBLISHABLE_KEY string ${SUPABASE_PUBLISHABLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjY252a3NpZ3RpeGJ6ZGlseHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MjQ1MjQsImV4cCI6MjA5ODQwMDUyNH0.SZp1S4e6-hYfOdJqi2Ktm9bjW6HDXxmb2CSJi_FcGjE}" AuraLinkNative/Info.plist
      - name: Arquivar
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project AuraLinkNative.xcodeproj \
            -scheme AuraLinkNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/AuraLink.xcarchive \
            CURRENT_PROJECT_VERSION=${{ inputs.build_number || github.run_number }} \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}"
      - name: Normalizar metadados da App Store
        run: |
          APP_PATH="$RUNNER_TEMP/AuraLink.xcarchive/Products/Applications/AuraLinkNative.app"
          APP_INFO="$APP_PATH/Info.plist"
          ICON_SOURCE="AuraLinkNative/Resources/Assets.xcassets/AppIcon.appiconset"
          cp "$ICON_SOURCE/AppIcon-60@2x.png" "$APP_PATH/AppIcon60x60@2x.png"
          cp "$ICON_SOURCE/AppIcon-60@3x.png" "$APP_PATH/AppIcon60x60@3x.png"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$APP_INFO" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$APP_INFO"
      - name: Exportar e enviar ao TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.auralink.app string $PROFILE_NAME" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AuraLink.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
