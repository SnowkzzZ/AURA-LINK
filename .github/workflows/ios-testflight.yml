name: Aura Link iOS · TestFlight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Enviar o build aprovado ao TestFlight
        required: true
        type: boolean
        default: false
      build_number:
        description: Número incremental do build
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Selecionar Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto
        run: xcodegen generate
      - name: Configurar ambiente público
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_URL string ${SUPABASE_URL:-https://example.supabase.co}" AuraLinkNative/Info.plist
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_PUBLISHABLE_KEY string ${SUPABASE_PUBLISHABLE_KEY:-build-validation-key}" AuraLinkNative/Info.plist
      - name: Compilar e testar no simulador
        run: |
          xcodebuild test \
            -project AuraLinkNative.xcodeproj \
            -scheme AuraLinkNative \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Preparar chaves e perfil
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          security create-keychain -p actions $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p actions $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k actions $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Configurar aplicação
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_URL string $SUPABASE_URL" AuraLinkNative/Info.plist
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_PUBLISHABLE_KEY string $SUPABASE_PUBLISHABLE_KEY" AuraLinkNative/Info.plist
      - name: Arquivar
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project AuraLinkNative.xcodeproj \
            -scheme AuraLinkNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/AuraLink.xcarchive \
            CURRENT_PROJECT_VERSION=${{ inputs.build_number }} \
            DEVELOPMENT_TEAM=$TEAM_ID \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      - name: Exportar e enviar ao TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AuraLink.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
